name: Starter kit tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install pytest numpy Pillow huggingface-hub
      - name: Run tests
        run: pytest -q
      - name: Check public scripts
        run: |
          python download_resources.py --help
          python create_submission.py --help
          python detection-recovery-track/scripts/baseline_decree.py --help
